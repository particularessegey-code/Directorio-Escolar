        <style>
  :root {
    --app-bg: #f4f7f6;
    --topbar-bg: #f4f7f6;
    --thead-bg: #212529;
    --thead-color: #ffffff;
    --area-link: #0d6efd;
    --area-link-hover: #0a58ca;
  }

  [data-bs-theme="dark"] {
    --app-bg: #0f1115;
    --topbar-bg: #0f1115;
    --thead-bg: #1f2937;
    --thead-color: #f8f9fa;
    --area-link: #6ea8fe;
    --area-link-hover: #3d8bfd;
  }

  body {
    background-color: var(--app-bg);
    transition: background-color .2s ease, color .2s ease;
  }

  .login-container {
    max-width: 400px;
    margin: 100px auto;
  }

  .area-link {
    color: var(--area-link);
    text-decoration: underline;
    cursor: pointer;
    font-weight: bold;
  }

  .area-link:hover {
    color: var(--area-link-hover);
  }

  /* Congelar la barra superior */
  #topBar {
    position: sticky;
    top: 0;
    z-index: 1020;
    background-color: var(--topbar-bg);
    padding-top: 1.5rem;
    padding-bottom: 1rem;
  }

  /* Scroll interno para la tabla */
  .table-responsive {
    max-height: 65vh;
    overflow-y: auto;
  }

  /* Encabezado de tabla fijo */
  .table thead th {
    position: sticky;
    top: 0;
    z-index: 1010;
    background-color: var(--thead-bg) !important;
    color: var(--thead-color) !important;
  }

  /* Ajustes extra para modo oscuro */
  [data-bs-theme="dark"] .card {
    background-color: #151a21;
    border-color: #26313f;
  }

  [data-bs-theme="dark"] .table {
    --bs-table-color: #e9ecef;
    --bs-table-bg: #151a21;
    --bs-table-border-color: #2b3643;
    --bs-table-hover-bg: #1d2530;
  }

  [data-bs-theme="dark"] .form-control,
  [data-bs-theme="dark"] .form-select {
    background-color: #1b2330;
    border-color: #303b4d;
    color: #e9ecef;
  }

  [data-bs-theme="dark"] .btn-light {
    background-color: #26313f;
    border-color: #374457;
    color: #e9ecef;
  }

  [data-bs-theme="dark"] .text-muted {
    color: #9aa6b2 !important;
  }

  [data-bs-theme="dark"] ::-webkit-scrollbar-track {
    background: #151a21;
  }

  [data-bs-theme="dark"] ::-webkit-scrollbar-thumb {
    background: #374457;
    border-radius: 8px;
  }
 /* Estilo mejorado para la columna COMPARTE */
.comparte-chip {
    display: inline-block;
    background-color: #e9ecef; /* Gris muy claro para modo luz */
    color: #495057;            /* Texto oscuro legible */
    padding: 4px 10px;
    border-radius: 20px;       /* Forma de píldora completa */
    font-size: 0.85rem;
    font-weight: 600;
    min-width: 30px;
    text-align: center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); /* Borde sutil */
}

/* Variante para Modo Oscuro */
[data-bs-theme="dark"] .comparte-chip {
    background-color: #2c3540;
    color: #adb5bd;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
}

/* Estado vacío: Solo un punto discreto o nada */
.comparte-empty {
    color: #ced4da;
    font-size: 0.8rem;
}
[data-bs-theme="dark"] .comparte-empty {
    color: #495057;
}
</style>

<script>
(function () {
  try {
    const savedUser = sessionStorage.getItem('crudUser');

  } catch (e) {}
})();

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzMsGyhP1U0oscSYR8_4zzKBINUK7soYwDxXj7YXsdYYiudveNyNL4YJGpYIqZj-LCu/exec';
    let currentUser = null;
    let currentData = [];
    let filteredData = [];
    const THEME_STORAGE_KEY = 'escuelas_theme';

function getSavedTheme() {
  try {
    return localStorage.getItem(THEME_STORAGE_KEY) || 'light';
  } catch (e) {
    return 'light';
  }
}

function saveThemePreference(theme) {
  try {
    localStorage.setItem(THEME_STORAGE_KEY, theme);
  } catch (e) {}
}
function canUseDarkMode() {
  return !!currentUser && (currentUser.nivel === 'ADMIN' || currentUser.nivel === 'CONSULTA');
}

function applyTheme(theme, savePreference = true) {
  theme = theme === 'dark' ? 'dark' : 'light';

  const root = document.documentElement;
  root.setAttribute('data-bs-theme', theme);

  const icon = document.getElementById('darkModeIcon');
  const btn = document.getElementById('btnDarkMode');

  if (icon) {
    icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
  }

  if (btn) {
    btn.classList.toggle('btn-outline-secondary', theme !== 'dark');
    btn.classList.toggle('btn-outline-light', theme === 'dark');
    btn.title = theme === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
  }

  if (savePreference) {
    saveThemePreference(theme);
  }
}

function toggleDarkMode() {
  if (!canUseDarkMode()) return;

  const currentTheme = document.documentElement.getAttribute('data-bs-theme') === 'dark'
    ? 'dark'
    : 'light';

  const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(nextTheme, true);
}

function updateDarkModeAccess() {
    const allowed = canUseDarkMode(); // Devuelve true solo si es ADMIN o CONSULTA
    const btn = document.getElementById('btnDarkMode');

    if (!btn) return; // Seguridad: si no existe el botón, salimos

    if (allowed) {
        // 1. MOSTRAR el botón (quitar clase d-none)
        btn.classList.remove('d-none');
        
        // 2. Aplicar el tema guardado en localStorage (si venía dark, sigue dark)
        const savedTheme = getSavedTheme();
        applyTheme(savedTheme, false); 
    } else {
        // 3. OCULTAR el botón (agregar clase d-none)
        btn.classList.add('d-none');
        
        // 4. FORZAR modo claro para los usuarios que no pueden usar oscuro
        applyTheme('light', false);
    }
}

    // Variables de Paginación
    let currentPage = 1;
    const rowsPerPage = 50; 

    // DICCIONARIO DE ENLACES DE MY MAPS POR ÁREA
    const AREA_MAPS = {

    // Función del ojo para la contraseña
    document.getElementById('togglePassword').addEventListener('click', function () {
        const passInput = document.getElementById('txtPass');
        const eyeIcon = document.getElementById('eyeIcon');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.classList.remove('bi-eye-slash');
            eyeIcon.classList.add('bi-eye');
        } else {
            passInput.type = 'password';
            eyeIcon.classList.remove('bi-eye');
            eyeIcon.classList.add('bi-eye-slash');
        }
    });
        // Detectar cuándo se CIERRA el menú de notificaciones para marcarlas como leídas
    document.getElementById('btnNotif').addEventListener('hidden.bs.dropdown', function () {
        markAsRead();
    });

    async function apiRequest(params, method='GET', body=null) {
        let url = API_URL;
        let options = { method: method };
        if(method === 'GET') {
            url += '?' + new URLSearchParams(params).toString();
        } else {
            options.body = JSON.stringify(body);
        }
        const resp = await fetch(url, options);
        return await resp.json();
    }

    async function checkNotifications() {
        if (!currentUser || currentUser.nivel !== 'ADMIN') return;
        const res = await apiRequest({ action: 'getNotifications', username: currentUser.username, password: currentUser.pass });
        if (res.success) {
            const notifs = res.data;
            const badge = document.getElementById('notifBadge');
            const list = document.getElementById('notifList');
            if (notifs.length > 0) {
                badge.innerText = notifs.length;
                badge.classList.remove('d-none');

    function normalizeString(str) {
        return str.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function initAreaFilter() {
    const select = document.getElementById('filterArea');
    for (let i = 1; i <= 26; i++) {
        const option = document.createElement('option');
        option.value = i.toString();
        option.textContent = 'Área ' + i;
        select.appendChild(option);
    }
}
function populateComparteFilter() {
    const select = document.getElementById('filterComparte');
    // Guardamos selección previa
    const currentValue = select.value; 
    
    // Limpiamos opciones excepto la primera ("Todos")
    while(select.options.length > 1) {
        select.remove(1);
    }

    // Extraemos valores únicos tratando null/undefined/vacío como "SIN GRUPO"
    const uniqueValues = new Set();
    
    currentData.forEach(row => {
        let val = row['COMPARTE'];
        
        // Normalizamos: Si es null, undefined o string vacío, lo marcamos especial
        if (val === null || val === undefined || String(val).trim() === '') {
            uniqueValues.add('__EMPTY__'); // Marcador interno para "vacío"
        } else {
            // Convertimos a string para evitar problemas de tipo (número vs texto)
            uniqueValues.add(String(val).trim());
        }
    });

    // Ordenamos numéricamente los grupos reales primero
    const sortedGroups = [...uniqueValues]
        .filter(v => v !== '__EMPTY__') // Quitamos el marcador temporal para ordenar
        .sort((a, b) => {
            const numA = parseFloat(a);
            const numB = parseFloat(b);
            if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
            return String(a).localeCompare(String(b));
        });

    // Agregamos los grupos numéricos/textuales
    sortedGroups.forEach(val => {
        const option = document.createElement('option');
        option.value = val;
        option.textContent = 'Grupo #' + val; 
        select.appendChild(option);
    });

    // AGREGAMOS LA OPCIÓN ESPECIAL PARA LAS QUE NO COMPARTEN
    if (uniqueValues.has('__EMPTY__')) {
        const emptyOption = document.createElement('option');
        emptyOption.value = '__EMPTY__';
        emptyOption.textContent = '(Sin Grupo / Mono-nivel)';
        select.appendChild(emptyOption);
    }

    // Restaurar selección si existía
    if ([...select.options].some(opt => opt.value === currentValue)) {
        select.value = currentValue;
    }
}

    // Función central que aplica TODOS los filtros a la vez
    // Función central que aplica TODOS los filtros a la vez
function applyFilters(resetPage = true) {
    const searchTerm = normalizeString(document.getElementById('searchInput').value);
    const filterArea = document.getElementById('filterArea').value;
    const filterNivel = document.getElementById('filterNivel').value.toUpperCase();
    const filterStatus = document.getElementById('filterStatus').value.toUpperCase();
    
    // ⚠️ IMPORTANTE: Declaramos filterComparte UNA SOLA VEZ aquí afuera
    const filterComparte = document.getElementById('filterComparte') ? document.getElementById('filterComparte').value : ''; 

    filteredData = currentData.filter(row => {
        // 1. Filtro de texto general
        const nombre = normalizeString(row['NOMBRE ESCUELA'] || '');
        const clave = normalizeString(row['CLAVE C.C.T.'] || '');
        const nivel = normalizeString(row['NIVEL'] || '');
        const matchText = nombre.includes(searchTerm) || clave.includes(searchTerm) || nivel.includes(searchTerm);

        // 2. Filtro de área
        const area = (row['AREA'] || '').toString().trim();
        const matchArea = filterArea === '' || area === filterArea;

        // 3. Filtro de nivel (mejorado para multinivel)
        const rowNivelStr = (row['NIVEL'] || '').toString().trim().toUpperCase();
        let matchNivel = false;
        if (filterNivel === '') {
            matchNivel = true;
        } else {
            matchNivel = rowNivelStr.includes(filterNivel);
        }

        // 4. Filtro de status
        const status = (row['STATUS'] || '').toString().trim().toUpperCase();
        const matchStatus = filterStatus === '' || status === filterStatus;

        // 5. Filtro de COMPARTE
        // Usamos la variable externa 'filterComparte' definida arriba
        const rawVal = row['COMPARTE'];
        let rowValNormalized = '';
        
        if (rawVal === null || rawVal === undefined || String(rawVal).trim() === '') {
            rowValNormalized = '__EMPTY__';
        } else {
            rowValNormalized = String(rawVal).trim();
        }

        let matchComparte = true;
        if (filterComparte !== '') {
            matchComparte = (rowValNormalized === filterComparte);
        }

        // Retornar si cumple TODAS las condiciones
        return matchText && matchArea && matchNivel && matchStatus && matchComparte;
    }); // Fin del .filter()

    if (resetPage) currentPage = 1;
    
    const totalPages = Math.ceil(filteredData.length / rowsPerPage);
    if (currentPage > totalPages) {
        currentPage = totalPages > 0 ? totalPages : 1;
    }
    
    renderTable();
} // Fin de la función applyFilters

// La llama el buscador y los selects
function filterTable() {
    applyFilters(true);
}
    function renderTable() {
    const tbody = document.getElementById('tblData');
    tbody.innerHTML = '';
    
    const totalItems = filteredData.length;
    const totalPages = Math.ceil(totalItems / rowsPerPage);
    const startIndex = (currentPage - 1) * rowsPerPage;
    const endIndex = startIndex + rowsPerPage;
    const pageData = filteredData.slice(startIndex, endIndex);
    
    document.getElementById('lblCount').innerText = `${totalItems} escuelas encontradas`;

    const showComparte = (currentUser.nivel === 'ADMIN' || currentUser.nivel === 'CONSULTA');
    const colspanValue = showComparte ? 10 : 9; // 9 base + 1 comparte

    if(pageData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${colspanValue}" class="text-center text-danger py-4">No se encontraron escuelas.</td></tr>`;
        return; // Salir temprano si no hay datos
    }

    pageData.forEach((row, localIndex) => {
        const globalIndex = startIndex + localIndex;
        
        // Botón de Ubicación Individual
        const hasLocation = row['UBICACION'] && String(row['UBICACION']).trim() !== '';
        const locationBtnHtml = hasLocation   
            ? `<button class="btn btn-sm btn-primary me-1" onclick='openLocation(${globalIndex})' title="Ver Ubicación"><i class="bi bi-geo-alt-fill"></i></button>`   
            : `<button class="btn btn-sm btn-secondary me-1" disabled title="Sin ubicación"><i class="bi bi-geo-alt-fill"></i></button>`;

        // Enlace de Área (Click abre mapa general)
        const areaVal = (row['AREA'] || '').toString().trim();
        const areaHtml = AREA_MAPS[areaVal] 
            ? `<span class="area-link" onclick="openAreaMap('${areaVal}')">${row['AREA']}</span>` 
            : row['AREA'];

        // Procesamiento PERSONA M-F
        let personaMFDisplay = '-';
        if (row['PERSONA M-F']) {
            const val = String(row['PERSONA M-F']).toUpperCase().trim();
            if (val.includes('MORAL')) personaMFDisplay = 'Moral';
            else if (val.includes('FISICA') || val.includes('FÍSICA')) personaMFDisplay = 'Física';
            else personaMFDisplay = row['PERSONA M-F']; 
        }

        // Construcción de la fila
        let trHtml = `
            <tr>
                <td class="text-center">${row['NUM.'] || ''}</td>
                <td>${row['CLAVE C.C.T.'] || ''}</td>
                <td><strong>${row['NOMBRE ESCUELA'] || ''}</strong></td>
                <td>${row['TURNO'] || ''}</td>
                <td>${row['MUNICIPIO'] || ''}</td>
                <td class="text-center">${areaHtml}</td>
                <td class="text-center align-middle fw-bold small">${personaMFDisplay}</td>
        `;

        // Columna Comparte (Solo Admin/Consulta)
        if (showComparte) {
            const rawVal = row['COMPARTE'];
            if (rawVal !== null && rawVal !== undefined && String(rawVal).trim() !== '') {
                trHtml += `<td class="text-center align-middle"><span class="comparte-chip">#${rawVal}</span></td>`;
            } else {
                trHtml += `<td class="text-center align-middle"></td>`;
            }
        }

        // Status y Acciones
        trHtml += `
                <td class="text-center"><span class="badge bg-${row['STATUS']==='ACTIVO'?'success':'danger'}">${row['STATUS'] || ''}</span></td>
                <td class="text-center whitespace-nowrap">  
                    ${locationBtnHtml}
                    <button class="btn btn-sm btn-info text-white me-1" onclick='openViewModal(${globalIndex})'><i class="bi bi-eye"></i></button>  
                     ${currentUser.nivel !== 'CONSULTA' ? `<button class="btn btn-sm btn-warning me-1" onclick='openEditModal(${globalIndex})'><i class="bi bi-pencil-square"></i></button>` : ''}   
                     ${currentUser.nivel === 'ADMIN' ? `<button class="btn btn-sm btn-danger" onclick="deleteSchool(${row._row}, '${row['NUM.']}')" ><i class="bi bi-trash"></i></button>` : ''}  
                </td>
            </tr>
        `;

        tbody.innerHTML += trHtml;
    });
    
    renderPagination(totalPages);
}

    // FUNCIÓN PARA ABRIR EL MAPA DE LA ESCUELA
    function openLocation(index) {
        const row = filteredData[index];
        const url = row['UBICACION'];
        if (!url) return;
        
        let embedUrl = url;
        if (!url.includes('output=embed')) {
            embedUrl += (url.includes('?') ? '&' : '?') + 'output=embed';
        }

        document.getElementById('mapFrame').src = embedUrl;
        document.getElementById('mapLink').href = url;
        // AQUÍ AGREGAMOS EL NOMBRE DE LA ESCUELA AL TÍTULO
        document.getElementById('mapModalTitle').innerHTML = `<i class="bi bi-geo-alt-fill"></i> Ubicación de: ${row['NOMBRE ESCUELA']}`;
        new bootstrap.Modal(document.getElementById('mapModal')).show();
    }

    // NUEVA FUNCIÓN PARA ABRIR EL MAPA DEL ÁREA
    function openAreaMap(area) {
        const url = AREA_MAPS[area];
        if (!url) return;
        
        // Extraer el ID (mid) de la URL de Google My Maps para poder embeberlo
        const midMatch = url.match(/mid=([^&]+)/);
        if (!midMatch) return alert("Error al procesar el mapa del área.");
        
        const embedUrl = `https://www.google.com/maps/d/embed?mid=${midMatch[1]}`;
        
        document.getElementById('mapFrame').src = embedUrl;
        document.getElementById('mapLink').href = url; // El botón abre el editor completo
        document.getElementById('mapModalTitle').innerHTML = `<i class="bi bi-geo-alt-fill"></i> Mapa del Área ${area}`;
        new bootstrap.Modal(document.getElementById('mapModal')).show();
    }

    function renderPagination(totalPages) {
        const paginationEl = document.getElementById('pagination');
        paginationEl.innerHTML = '';
        if (totalPages <= 1) return;
        paginationEl.innerHTML += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage - 1})">Anterior</a></li>`;
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, currentPage + 2);
        if(startPage > 1) paginationEl.innerHTML += `<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`;
        for (let i = startPage; i <= endPage; i++) {
            paginationEl.innerHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="changePage(${i})">${i}</a></li>`;
        }
        if(endPage < totalPages) paginationEl.innerHTML += `<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`;
        paginationEl.innerHTML += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage + 1})">Siguiente</a></li>`;
    }

    function changePage(page) {
        event.preventDefault();
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        if (page >= 1 && page <= totalPages) {
            currentPage = page;
            renderTable();
            window.scrollTo(0, 0);
        }
    }

    function exportToExcel() {
    if(filteredData.length === 0) {
        alert("No hay datos para exportar.");
        return;
    }

    let dataToProcess;

    // Si es ADMIN o CONSULTA, exporta todo lo que está en pantalla (Activos e Inactivos)
    // Si es PREESCOLAR, PRIMARIA o SECUNDARIA, filtra solo las ACTIVO
    if (currentUser.nivel === 'ADMIN' || currentUser.nivel === 'CONSULTA') {
        dataToProcess = filteredData;
    } else {
        dataToProcess = filteredData.filter(row => row['STATUS'] === 'ACTIVO');

        if(dataToProcess.length === 0) {
            alert("No hay escuelas activas para exportar.");
            return;
        }
    }

    const dataToExport = dataToProcess.map(row => {
        const {_row, ...rest} = row;
        return rest;
    });

    const ws = XLSX.utils.json_to_sheet(dataToExport);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Escuelas");
    XLSX.writeFile(wb, `Escuelas_${currentUser.nivel}.xlsx`);
}

    async function saveSchool() {
    const btn = document.getElementById('btnSaveModal');
    if (btn.disabled) return;
    const nombreEscuelaInput = document.getElementById('txtNombre');
    const nombreValor = nombreEscuelaInput.value.trim();
    if (!nombreValor) {
        alert("El campo 'NOMBRE ESCUELA' es obligatorio.");
        nombreEscuelaInput.focus(); // Enfocar el input para que el usuario escriba ahí
        return; // Detener la ejecución si está vacío
    }
    btn.disabled = true;
    const textoOriginal = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando...';

    try {
        const rowId = document.getElementById('txtRow').value;
        let currentComparteValue = '';
        if (rowId) {
            const foundRow = filteredData.find(r => r._row == parseInt(rowId));
            if(foundRow) {
                currentComparteValue = foundRow['COMPARTE'] || '';
            }
        }

        const payload = {
            username: currentUser.username,
            password: currentUser.pass,
            action: rowId ? 'update' : 'create',
            row: rowId ? parseInt(rowId) : null,
            data: {
                'NUM.': document.getElementById('txtNum').value === 'Auto' ? '' : document.getElementById('txtNum').value,
                'CLAVE C.C.T.': document.getElementById('txtClave').value,
                'NOMBRE ESCUELA': document.getElementById('txtNombre').value,
                'NIVEL': document.getElementById('txtNivel').value,
                'TURNO': document.getElementById('txtTurno').value,
                'MUNICIPIO': document.getElementById('txtMunicipio').value,
                'LOCALIDAD': document.getElementById('txtLocalidad').value,
                'DIRECCION': document.getElementById('txtDireccion').value,
                'REPRESENTANTE LEGAL': document.getElementById('txtRepresentante').value,
                'TELEFONOS': document.getElementById('txtTelefonos').value,
                'CORREO ELECTRONICO': document.getElementById('txtCorreo').value,
                'ACUERDO': document.getElementById('txtAcuerdo').value,
                'FECHA DE ACUERDO': document.getElementById('txtFechaAcuerdo').value,
                'TOTAL DE ACUERDOS': document.getElementById('txtTotalAcuerdos').value,
                'STATUS': document.getElementById('txtStatus').value,
                'AREA': document.getElementById('txtArea').value,
                'VISITADOR': document.getElementById('txtVisitador').value,
                'PERSONA M-F': document.getElementById('txtPersonaMF').value,
                'OBSERVACIONES': document.getElementById('txtObservaciones').value,
                'UBICACION': document.getElementById('txtUbicacion').value,
                'COMPARTE': currentComparteValue 
            }
        };

        const res = await apiRequest({}, 'POST', payload);
        if (res.success) {
            bootstrap.Modal.getInstance(document.getElementById('schoolModal')).hide();
            refreshData();
            alert(res.message);
        } else {
            alert("Error: " + res.message);
        }
    } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
    }
}

    let eliminando = false; // guard global simple, ya que este botón no tiene id fijo por fila

async function deleteSchool(rowId, numEscuela) {
    if (eliminando) return;
    if (!confirm(`¿Estás seguro de eliminar la escuela NUM ${numEscuela}?`)) return;

    eliminando = true;
    try {
        const payload = { username: currentUser.username, password: currentUser.pass, action: 'delete', row: rowId };
        const res = await apiRequest({}, 'POST', payload);
        if (res.success) {
            refreshData();
            alert(res.message);
        } else {
            alert("Error: " + res.message);
        }
    } finally {
        eliminando = false;
    }
}
